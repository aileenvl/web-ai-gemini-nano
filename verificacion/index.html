<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'">
<title>Verificación real de las APIs de IA de Chrome</title>
<style>body{font:17px system-ui;color:#202124;max-width:1120px;margin:40px auto;padding:0 24px}h1{font-weight:500}button{font:inherit;padding:10px 14px;margin:4px;border:1px solid #dadce0;border-radius:8px;background:#e8f0fe;color:#174ea6}button:disabled{opacity:.5}textarea{width:100%;height:140px;font:15px system-ui}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f4;padding:20px;border-radius:12px}progress{width:250px}#status{font-weight:600;color:#174ea6}table{border-collapse:collapse;width:100%;margin:24px 0}td,th{border:1px solid #dadce0;padding:8px;text-align:left}</style>
<h1>Verificación real de las APIs de IA de Chrome</h1>
<p>Prueba de fragmentos en este equipo y perfil. Sin respuestas simuladas ni servicios de IA remotos.</p>
<p id="status" role="status">Listo para comprobar.</p>
<button id="inspect">Comprobar APIs</button>
<button id="prepareButton">Probar Prompt original</button>
<button id="summarizeButton">Probar Summarizer</button>
<button id="actionsButton">Probar acciones en JSON</button>
<button id="languageButton">Detectar y traducir</button>
<button id="writerButton">Probar Writer</button>
<button id="rewriterButton">Probar Rewriter</button>
<button id="proofreaderButton">Probar Proofreader</button>
<button id="save">Descargar acta JSON</button>
<p><label>Progreso de descarga <progress id="progress" max="1" value="0"></progress></label></p>
<label for="notes">Notas de prueba</label><textarea id="notes"></textarea>
<h2>Compatibilidad observada</h2><div id="matrix">Pendiente.</div>
<h2>Último resultado</h2><pre id="answer">Sin ejecuciones.</pre>
<h2>Acta de esta pestaña</h2><pre id="report">Sin ejecuciones.</pre>
<script src="bindings.js" defer></script><script src="original-prompt.js" defer></script><script src="tests.js" type="module"></script>
</html>
